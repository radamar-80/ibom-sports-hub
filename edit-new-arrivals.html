<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit New Arrivals — Ibom Sports Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="collection-editor.css">
</head>
<body>
  <header class="header">
    <img class="brand-logo" src="logo.png" alt="Ibom Sports Hub logo">
    <div class="brand-title">
      <span class="brand-name">IBOM SPORTS HUB</span>
      <span class="brand-subtitle">EDIT NEW ARRIVALS</span>
    </div>
    <a class="back-link" href="admin-dashboard.html">← Dashboard</a>
  </header>
  <main class="page">
    <section class="intro">
      <h1>New Arrivals</h1>
      <p>Manage the subsections shown in the New Arrivals slider. Each subsection needs a name, a unique ID, and a display picture. The arrow on each home slider picture opens that exact subsection.</p>
    </section>
    <div class="toolbar">
      <div>
        <div class="toolbar-title">New Arrivals subsections</div>
        <div class="save-status" id="saveStatus"></div>
      </div>
      <button class="save-btn" id="saveBtn" onclick="saveCollection()">Save Changes</button>
    </div>
    <div id="collectionEditor"><div class="loading">Loading new arrivals…</div></div>
    <button class="add-btn" onclick="addCollectionItem()">＋ Add subsection</button>
  </main>
  <script src="admin-auth.js"></script>
  <script>adminRequireSession(); window.COLLECTION_KEY = "newArrivals";</script>
  <script src="collection-editor.js"></script>
</body>
</html>
